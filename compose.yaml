services:
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${APP_PORT:-8084}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://campus:${DB_PASSWORD:?set DB_PASSWORD}@db:3306/campusclaw?charset=utf8mb4
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
      UPLOAD_DIR: /srv/data/uploads
      MODEL_CACHE: /srv/data/models
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes: ["uploads:/srv/data/uploads", "models:/srv/data/models"]
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
  db:
    image: mysql:8.4
    command: ["--ngram-token-size=2", "--innodb-ft-enable-stopword=OFF"]
    environment:
      MYSQL_DATABASE: campusclaw
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -ucampus campusclaw -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: ["vectors:/qdrant/storage"]
volumes:
  db-data:
  uploads:
  vectors:
  models:
